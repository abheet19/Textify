name: Verify Textify
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  workflow-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: textify_test
          POSTGRES_USER: textify_test
          POSTGRES_PASSWORD: synthetic-ci-password
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U textify_test -d textify_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEXTIFY_TEST_DATABASE_URL: postgresql://textify_test:synthetic-ci-password@127.0.0.1:5432/textify_test
      TEXTIFY_SKIP_DB_INIT: '1'
      TEXTIFY_RUN_BROWSER_TESTS: '1'
      TEXTIFY_EVIDENCE_DIR: ${{ github.workspace }}/browser-results
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements-dev.txt
      - name: Enable pgvector in the disposable CI database
        run: |
          python - <<'PY'
          import os, psycopg
          with psycopg.connect(os.environ['TEXTIFY_TEST_DATABASE_URL']) as conn:
              conn.execute('CREATE EXTENSION IF NOT EXISTS vector')
          PY
      - name: Install isolated browser test tooling
        run: |
          npm install --no-save --ignore-scripts playwright@1.49.1
          npx playwright install --with-deps chromium
      - name: Test real APIs, pgvector and browser with synthetic provider responses
        run: python -m pytest -q --tb=short
      - name: Fresh-checkout Docker build
        run: |
          docker build --tag textify-ci .
          docker build --file Dockerfile.local --tag textify-local-ci .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: textify-browser-evidence
          path: browser-results/
          if-no-files-found: ignore
