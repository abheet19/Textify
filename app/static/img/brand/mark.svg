<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Textify">
  <title>Textify</title>
  <!--
    The mark: lines of text, condensing. Four bars of decreasing width, each
    centered on the one above it, ending in a single lit square — a page
    distilled down to its point. Where Vantage's funnel says "watch what
    drops off," this says "watch what's left" — the bars don't spill past
    an edge, they converge, symmetric, toward the kept line at the bottom.

    Palette:
      #0C0A08 ground · #F0AE6A copper (light) · #E0954D copper (mid) ·
      #B9702A copper (deep) · #F2ECE3 bone

    Same three planes as the Zeno/Weft/Vantage marks, so the family reads as
    one hand, but the geometry is Textify's own — centered convergence, not
    a left-aligned funnel or an interlace:
      1. the cast  — deepest edge, near-black, where the page meets its ground
      2. the flank — the extruded side, deep copper, offset down-right
      3. the face  — the front plane, in copper gradient, with a bone edge
  -->
  <defs>
    <linearGradient id="line" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#F7C68C"/>
      <stop offset="0.5" stop-color="#F0AE6A"/>
      <stop offset="1" stop-color="#CC8138"/>
    </linearGradient>
    <linearGradient id="flank" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#B9702A"/>
      <stop offset="1" stop-color="#5E3410"/>
    </linearGradient>
    <linearGradient id="lit" x1="0" y1="0" x2="1" y2="0.7">
      <stop offset="0" stop-color="#F2ECE3" stop-opacity="0.58"/>
      <stop offset="0.6" stop-color="#F2ECE3" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#F2ECE3" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="256" height="256" rx="56" fill="#0C0A08"/>

  <!-- the depth planes: the whole stack, twice, in flat dark, offset back -->
  <g fill="#050403">
    <rect x="41" y="68" width="174" height="28" rx="14"/>
    <rect x="69" y="114" width="118" height="28" rx="14"/>
    <rect x="97" y="160" width="62" height="28" rx="14"/>
    <rect x="118" y="199" width="20" height="20" rx="6"/>
  </g>
  <g fill="url(#flank)" transform="translate(6,6)">
    <rect x="41" y="68" width="174" height="28" rx="14"/>
    <rect x="69" y="114" width="118" height="28" rx="14"/>
    <rect x="97" y="160" width="62" height="28" rx="14"/>
    <rect x="118" y="199" width="20" height="20" rx="6"/>
  </g>

  <!-- the face: four lines converging on-center, ending in one kept point -->
  <g fill="url(#line)">
    <rect x="41" y="68" width="174" height="28" rx="14"/>
    <rect x="69" y="114" width="118" height="28" rx="14"/>
    <rect x="97" y="160" width="62" height="28" rx="14"/>
  </g>
  <rect x="118" y="199" width="20" height="20" rx="6" fill="#F7C68C"/>

  <!-- the light catching the top edge of each line, brightest on the kept point -->
  <rect x="41" y="68" width="174" height="10" rx="5" fill="url(#lit)"/>
  <rect x="69" y="114" width="118" height="10" rx="5" fill="url(#lit)"/>
  <rect x="97" y="160" width="62" height="10" rx="5" fill="url(#lit)"/>
  <rect x="118" y="199" width="20" height="8" rx="4" fill="#F2ECE3" opacity="0.6"/>
</svg>
